<ion-menu side="end" menuId="first" contentId="main-content">
  <ion-header>
    <ion-toolbar style="--background: #166534; --color: #ffffff;">
      <ion-title>Bienvenido</ion-title>

      <a routerLink="/perfil" routerDirection="root" slot="end" style="margin-right: 12px; color: #ffffff; text-decoration: none; font-weight: 500;">
        Mi Perfil
      </a>
    </ion-toolbar>
   
  </ion-header> 

  <ion-content>
    <ion-list>

      <ion-menu-toggle auto-hide="false">
        <ion-item routerLink="/Home" routerDirection="root">Inicio</ion-item>
      </ion-menu-toggle>

      <ion-menu-toggle auto-hide="false">
        <ion-item routerLink="/ListarVehiculos" routerDirection="root">Vehículo</ion-item>
      </ion-menu-toggle>

      <ion-menu-toggle auto-hide="false">
        <ion-item routerLink="/empleados" routerDirection="root">Empleados</ion-item>
      </ion-menu-toggle>
      
      <ion-menu-toggle auto-hide="false">
        <ion-item routerLink="/servicios" routerDirection="root">Servicios</ion-item>
      </ion-menu-toggle>
      <ion-menu-toggle auto-hide="false">
        <ion-item routerLink="/ReportesVehiculos" routerDirection="root">Historial de Reportes</ion-item>
      </ion-menu-toggle>

      <ion-menu-toggle auto-hide="false">
        <ion-item button (click)="logout()" color="danger" detail="false">
          <ion-label>Cerrar Sesión</ion-label>
        </ion-item>
      </ion-menu-toggle>
      
    </ion-list>
  </ion-content>
</ion-menu>
