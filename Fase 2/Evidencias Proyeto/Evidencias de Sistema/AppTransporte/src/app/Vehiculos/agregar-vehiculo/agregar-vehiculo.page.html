<ion-header>
  <ion-toolbar>

   <ion-title slot="start" class="ion-hide-md-down" >
      <a routerLink="/Home" style="color: white; text-decoration: none; margin-right: 15px; font-weight: normal;">Inicio</a>
      <a routerLink="/ListarVehiculos" style="color: white; text-decoration: none; margin-right: 15px; font-weight: normal;">Vehículos</a>
      <a routerLink="/empleados" style="color: white; text-decoration: none; margin-right: 15px; font-weight: normal;">Empleados</a>
    </ion-title>
    
    <div slot="end" class="ion-hide-md-down" style="padding-right: 16px;">
        <a (click)="logout()" style="color: white; text-decoration: none; font-weight: normal; cursor: pointer;">Cerrar Sesión</a>
    </div>

    <ion-buttons class="ion-hide-md-up"slot="start">
      <ion-back-button defaultHref="./ListarVehiculos"></ion-back-button>
    </ion-buttons>

    <ion-title class="ion-hide-md-up">Agregar Vehículo</ion-title>

  </ion-toolbar>
</ion-header>


<ion-content class="ion-padding">
   <div style="width: 100%; max-width: 900px; margin: 0 auto;">
<div class="form-card" style="margin-top: 20px; padding: 20px; border-radius: 12px;  background-color: White;">
  <ion-item>
    <ion-label position="floating">Patente</ion-label>
    <ion-input [(ngModel)]="vehiculo.patente"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Marca</ion-label>
    <ion-input [(ngModel)]="vehiculo.marca"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Modelo</ion-label>
    <ion-input [(ngModel)]="vehiculo.modelo"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Año</ion-label>
    <ion-input type="number" [(ngModel)]="vehiculo.anio"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Próximo cambio de aceite</ion-label>
    <ion-input type="number" [(ngModel)]="vehiculo.proximoKilometraje"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Estado DPF</ion-label>
    <ion-input [(ngModel)]="vehiculo.estadoDpf"></ion-input>
  </ion-item>
  <div style="margin-top: 20px; text-align: center;">

  <ion-button expand="block" (click)="tomarFoto()">
    📷 Tomar foto del vehículo
  </ion-button>

  <div *ngIf="fotoPreview" style="margin-top: 15px;">
      <p><strong>Foto del vehículo:</strong></p>

      <img
        [src]="fotoPreview"
        alt="Foto del vehículo"
        style="
          width: 100%;
          max-width: 400px;
          border-radius: 12px;
          object-fit: cover;
        "
      >
    </div>

  </div>

  <ion-item>
    <ion-label position="stacked">Fecha vencimiento revisión</ion-label>
    <ion-input
      type="date"
      [(ngModel)]="vehiculo.fechaRevisionTecnica"
      (ionChange)="actualizarEstadoRevision()">
    </ion-input>
  </ion-item>
            
  <ion-item>
    <ion-select label="Estado extintor" placeholder="Seleccione" [(ngModel)]="vehiculo.estadoExtintor">
      <ion-select-option value="Vigente">Vigente</ion-select-option>
        <ion-select-option value="Vencido">Vencido</ion-select-option>
        </ion-select>
      </ion-item>

  <ion-item>
    <ion-label position="floating">Observación</ion-label>
    <ion-input [(ngModel)]="vehiculo.observacion"></ion-input>
  </ion-item><br><br>

  <ion-button expand="block" (click)="guardarVehiculo()">
    Guardar vehículo
  </ion-button>
</div>
</div>
</ion-content>
