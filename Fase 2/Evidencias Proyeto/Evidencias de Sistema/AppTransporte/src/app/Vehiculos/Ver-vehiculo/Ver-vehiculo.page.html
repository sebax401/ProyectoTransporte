<app-barralateral></app-barralateral>

<div class="ion-page" id="main-content">

  <ion-header>
    <ion-toolbar>
      <ion-title  class="ion-hide-md-down">
        <a routerLink="/Home" class="ion-hide-md-down"style="color: white; text-decoration: none; margin-right: 15px; font-weight: normal;">Inicio</a>
        <a routerLink="/ListarVehiculos" class="ion-hide-md-down"style="color: white; text-decoration: none; margin-right: 15px; font-weight: normal;">Vehículos</a>
        <a routerLink="/empleados" class="ion-hide-md-down" style="color: white; text-decoration: none; margin-right: 15px; font-weight: normal;">Empleados</a>
      </ion-title>
    <div slot="end" class="ion-hide-md-down" style="padding-right: 16px;">
        <a (click)="logout()" style="color: white; text-decoration: none; font-weight: normal; cursor: pointer;">Cerrar Sesión</a>
    </div>

      <ion-title class="ion-hide-md-up">Vehículos</ion-title>
    <ion-buttons slot="end" class="ion-hide-md-up">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>

    </ion-toolbar>
  </ion-header>

  <ion-content [fullscreen]="true" class="ion-padding bg-light">

    <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
      <ion-refresher-content></ion-refresher-content>
    </ion-refresher>

    <div class="ion-hide-md-up mobile-search-container">
      <ion-searchbar animated="true" placeholder="Buscar vehículo..." (ionInput)="handleInput($event)">
      </ion-searchbar>
    </div>



    <div class="vehicles-board" style="max-width: 2000px; justify-content: center; margin: 0 auto; padding: 0 10px; ">

      <div class="ion-hide-md-down desktop-top-bar">
        <ion-grid class="ion-no-padding">
          <ion-row class="ion-align-items-center">

            <!-- Columna de la barra de búsqueda -->
            <ion-col class="ion-no-padding">
              <ion-searchbar animated="false" placeholder="Buscar vehículo..." (ionInput)="handleInput($event)"
                class="custom-searchbar">
              </ion-searchbar>
            </ion-col>

            <!-- Columna del botón -->
            <ion-col size="auto" class="ion-no-padding ion-margin-start">
              <ion-button shape="round" fill="outline" class="add-desktop-btn" routerLink="/agregar-vehiculo"
                style="--background: gold; --color: #000000; --border-color: #d4af37;">
                Agregar nuevo vehículo
              </ion-button>
            </ion-col>

          </ion-row>
        </ion-grid>
      </div>


      <ion-grid>
        <ion-row>

          <ion-col size="12" size-md="6" size-lg="3" *ngFor="let vehiculo of results">
            <ion-card class="vehicle-card" routerLink="/datos-vehiculo/{{ vehiculo.idVehiculo }}">

              <div class="image-wrapper">
                <img *ngIf="vehiculo.fotoUrl" [src]="'https://proyectotransporte.onrender.com' + vehiculo.fotoUrl"
                  alt="Foto del vehículo" />

                <div class="no-photo" *ngIf="!vehiculo.fotoUrl">
                  <ion-icon name="car-outline" color="primary"></ion-icon>
                </div>
              </div>

              <ion-card-header>
                <ion-card-subtitle>
                  {{ vehiculo.modelo }}
                </ion-card-subtitle>
                <ion-card-title class="plate-title">
                  {{ vehiculo.patente }}
                </ion-card-title>
              </ion-card-header>

              <ion-card-content>
                <p><strong>Próximo Km:</strong> {{ vehiculo.proximoKilometraje }}</p>
                <p><strong>Estado DPF:</strong> {{ vehiculo.estadoDpf }}</p>
                <p><strong>Observación:</strong> {{ vehiculo.observacion }}</p>
                <p><strong>Estado de revisión:</strong> {{ vehiculo.estadoRevision }}</p>
              </ion-card-content>

            </ion-card>
          </ion-col>

        </ion-row>
      </ion-grid>
    </div>



    <ion-fab vertical="bottom" horizontal="end" slot="fixed" class="ion-hide-md-up">
      <ion-fab-button routerLink="/agregar-vehiculo" style="--background: #166534;">
        <span style="color: #ffffff !important; font-size: 32px; font-weight: bold; line-height: 1;">+</span>
      </ion-fab-button>
    </ion-fab>



  </ion-content>

</div>
